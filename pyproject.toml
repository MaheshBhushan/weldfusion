[project]
name = "weldfusion"
version = "0.1.0"
description = "Sensor data fusion, feature extraction and defect classification for laser weld quality"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.4",
    "h5py>=3.10",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pyyaml>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
dvc = ["dvc>=3.50"]

[project.scripts]
weldfusion = "weldfusion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weldfusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
